server:
  port: ${ACCOUNTS_SERVER_PORT:8083}

spring:
  application:
    name: accounts-app
  datasource:
    url: ${SPRING_DATASOURCE_URL_ACCOUNTS:jdbc:postgresql://localhost:5434/accountdb}
    username: ${SPRING_DATASOURCE_USERNAME_ACCOUNTS:user}
    password: ${SPRING_DATASOURCE_PASSWORD_ACOUNTS:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    producer:
      bootstrap-servers: ${KAFKA_SERVER_URL:localhost:9092}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  liquibase:
    change-log: classpath:liquibase/changelog-master.yml

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080/realms/master}

# Используем Sevice Discovry Kubrnettes, пока комментируем consul
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}          # Адрес Consul (по умолчанию localhost)
      port: ${CONSUL_PORT:8500}               # Порт Consul (8500 по умолчанию)
      discovery:
        service-name: accounts-app

#      config:
#        enabled: true            # Включаем Consul Config для внешней конфигурации
#        defaultContext: application  # Контекст по умолчанию
#        prefixes: config

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
  tracing:
    sampling:
      probability: 1 # частота трейсов
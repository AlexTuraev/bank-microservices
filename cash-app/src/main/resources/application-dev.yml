spring:
  application:
    name: cash-app
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_URL:http://localhost:8080/realms/master}
        registration:
          cash-app:
            provider: keycloak
            authorizationGrantType: client_credentials
            client-id: cash-app
            client-secret: ${CASH_OAUTH2_SECRET:3w77lFNTNMElcE9lTmD7B2H0V1GwYPRh}
            scope: profile
            clientAuthenticationMethod: client_secret_post
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080/realms/master}

#  cloud:
#    consul:
#      host: ${CONSUL_HOST:localhost}          # Адрес Consul (по умолчанию localhost)
#      port: ${CONSUL_PORT:8500}               # Порт Consul (8500 по умолчанию)
#      discovery:
#        service-name: cash-app
#      config:
#        enabled: true            # Включаем Consul Config для внешней конфигурации
#        prefixes: config           # Префикс в KV-хранилище Consul (по умолчанию "config")
#        defaultContext: application  # Контекст по умолчанию

server:
  port: ${CASH_APP_SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always